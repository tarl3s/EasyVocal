# Builds EasyVocal and runs its tests on Windows, macOS and Linux.
# Windows: every suite (portable, Windows platform, UI headless, the e2e run of the real app). The AI voices' tests (every OS) download
# RVC's public MIT models once (cached) and build an AI pack from them.
# macOS / Linux: the portable tests, the macOS/Linux platform tests (with the real CoreAudio / Carbon, and on Linux a real
# PulseAudio server and an X server) and the headless UI tests. Nothing is released from here.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build EasyVocal.sln -warnaserror
      - name: AI models cache (RVC's public MIT files, downloaded once)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ai-models/upstream
          key: ai-upstream-v1-${{ runner.os }}
      - name: Test (every suite)
        run: dotnet test EasyVocal.sln --no-build --logger "console;verbosity=normal"
        env:
          EV_AI_MODELS: ${{ runner.temp }}/ai-models

  macos:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: |
          dotnet build tests/EasyVocal.Tests -warnaserror
          dotnet build tests/EasyVocal.Tests.Platforms -warnaserror
          dotnet build tests/EasyVocal.UiTests -warnaserror
          dotnet build tests/EasyVocal.Ai.Tests -warnaserror
      - name: Portable tests
        run: dotnet test tests/EasyVocal.Tests --no-build
      - name: AI models cache (RVC's public MIT files, downloaded once)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ai-models/upstream
          key: ai-upstream-v1-${{ runner.os }}
      - name: AI voices tests
        run: dotnet test tests/EasyVocal.Ai.Tests --no-build --logger "console;verbosity=normal"
        env:
          EV_AI_MODELS: ${{ runner.temp }}/ai-models
      - name: macOS platform tests
        run: dotnet test tests/EasyVocal.Tests.Platforms --no-build --logger "console;verbosity=detailed"
      - name: UI tests (headless)
        run: dotnet test tests/EasyVocal.UiTests --no-build --logger "console;verbosity=normal"

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Fonts, a sound server and an X server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-noto-color-emoji fontconfig \
            pulseaudio pulseaudio-utils libpulse0 libasound2t64 libjack-jackd2-0 xvfb libx11-6
      - name: Start PulseAudio
        run: |
          pulseaudio --start --exit-idle-time=-1 --log-target=stderr
          pactl info
      - name: Build
        run: |
          dotnet build tests/EasyVocal.Tests -warnaserror
          dotnet build tests/EasyVocal.Tests.Platforms -warnaserror
          dotnet build tests/EasyVocal.UiTests -warnaserror
          dotnet build tests/EasyVocal.Ai.Tests -warnaserror
      - name: Portable tests
        run: dotnet test tests/EasyVocal.Tests --no-build
      - name: AI models cache (RVC's public MIT files, downloaded once)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ai-models/upstream
          key: ai-upstream-v1-${{ runner.os }}
      - name: AI voices tests
        run: dotnet test tests/EasyVocal.Ai.Tests --no-build --logger "console;verbosity=normal"
        env:
          EV_AI_MODELS: ${{ runner.temp }}/ai-models
      - name: Linux platform tests (real PulseAudio, Xvfb)
        env:
          EV_PULSE_TESTS: "1"
        run: xvfb-run -a dotnet test tests/EasyVocal.Tests.Platforms --no-build --logger "console;verbosity=detailed"
      - name: UI tests (headless)
        run: dotnet test tests/EasyVocal.UiTests --no-build --logger "console;verbosity=normal"

  # The downloads exactly as a release makes them (tools/Publish-Release.ps1 on Windows), then unpacked and started the
  # way a person does on a real Mac and a real Linux machine (tools/Test-Package.sh).
  packages:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build the release downloads (no upload)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\Publish-Release.ps1 -NoUpload -OutDir "$env:RUNNER_TEMP\packages"
      - uses: actions/upload-artifact@v4
        with:
          name: downloads
          path: |
            ${{ runner.temp }}/packages/EasyVocal-*.zip
            ${{ runner.temp }}/packages/EasyVocal-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  linux-package:
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: downloads
          path: downloads
      - name: A desktop's sound server and an X server (nothing .NET)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core fontconfig pulseaudio pulseaudio-utils libpulse0 xvfb xauth
          pulseaudio --start --exit-idle-time=-1
      - name: Unpack, install and start the Linux download
        run: sh tools/Test-Package.sh downloads/EasyVocal-linux-x64.tar.gz "$RUNNER_TEMP/linux-package"

  macos-package:
    needs: packages
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: downloads
          path: downloads
      - name: Unpack, sign ad hoc and start the Apple silicon download
        run: sh tools/Test-Package.sh downloads/EasyVocal-macos-arm64.zip "$RUNNER_TEMP/macos-package"

