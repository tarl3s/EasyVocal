# Builds EasyVocal and runs its tests on Windows, macOS and Linux.
# Windows: every suite (portable, Windows platform, UI headless, the e2e run of the real app).
# macOS / Linux: the portable tests, the macOS/Linux platform tests (with the real CoreAudio / Carbon, and on Linux a real
# PulseAudio server and an X server) and the headless UI tests. Nothing is released from here.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build EasyVocal.sln -warnaserror
      - name: Test (every suite)
        run: dotnet test EasyVocal.sln --no-build --logger "console;verbosity=normal"

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: |
          dotnet build tests/EasyVocal.Tests -warnaserror
          dotnet build tests/EasyVocal.Tests.Platforms -warnaserror
          dotnet build tests/EasyVocal.UiTests -warnaserror
      - name: Portable tests
        run: dotnet test tests/EasyVocal.Tests --no-build
      - name: macOS platform tests
        run: dotnet test tests/EasyVocal.Tests.Platforms --no-build --logger "console;verbosity=detailed"
      - name: UI tests (headless)
        run: dotnet test tests/EasyVocal.UiTests --no-build --logger "console;verbosity=normal"

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Fonts, a sound server and an X server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-noto-color-emoji fontconfig \
            pulseaudio pulseaudio-utils libpulse0 libasound2t64 libjack-jackd2-0 xvfb libx11-6
      - name: Start PulseAudio
        run: |
          pulseaudio --start --exit-idle-time=-1 --log-target=stderr
          pactl info
      - name: Build
        run: |
          dotnet build tests/EasyVocal.Tests -warnaserror
          dotnet build tests/EasyVocal.Tests.Platforms -warnaserror
          dotnet build tests/EasyVocal.UiTests -warnaserror
      - name: Native libraries
        run: ldd tests/EasyVocal.Tests.Platforms/bin/Debug/net8.0/runtimes/linux-x64/native/libportaudio.so || true
      - name: Portable tests
        run: dotnet test tests/EasyVocal.Tests --no-build
      - name: Linux platform tests (real PulseAudio, Xvfb)
        env:
          EV_PULSE_TESTS: "1"
        run: xvfb-run -a dotnet test tests/EasyVocal.Tests.Platforms --no-build --logger "console;verbosity=detailed"
      - name: UI tests (headless)
        run: dotnet test tests/EasyVocal.UiTests --no-build --logger "console;verbosity=normal"
